name: Release signed APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Same-tag runs must serialize: an existing release is verified, never replaced.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "Invalid release tag '$TAG_NAME'. Expected vMAJOR.MINOR.PATCH with components from 0 to 999." >&2
            exit 1
          fi

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" && test -n "$RELEASE_STORE_PASSWORD" && test -n "$RELEASE_KEY_ALIAS" || { echo "Missing required release signing secret." >&2; exit 1; }
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/android-tv-audio-reactive-release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo "Decoded release keystore is empty." >&2; exit 1; }
          actual="$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$RELEASE_KEY_ALIAS" -storepass:env RELEASE_STORE_PASSWORD 2>/dev/null | while IFS= read -r line; do case "$line" in *SHA256:*) printf '%s' "${line#*: }"; break ;; esac; done)"
          actual="${actual//:/}"
          actual="${actual^^}"
          [[ "$actual" =~ ^[A-F0-9]{64}$ ]] || { echo "Could not derive the release signing certificate SHA-256 fingerprint." >&2; exit 1; }
          echo "RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RELEASE_CERT_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Run debug unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          ./gradlew :app:assembleRelease

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          APK_NAME="android-tv-audio-reactive-${TAG_NAME}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          RELEASE_DIR="$(mktemp -d)"
          cleanup() { rm -rf "$RELEASE_DIR"; }
          trap cleanup EXIT
          verify_existing_release() {
            gh release download "$TAG_NAME" --pattern "$APK_NAME" --pattern "$APK_NAME.sha256" --dir "$RELEASE_DIR" --clobber
            (cd "$RELEASE_DIR" && sha256sum --check "$APK_NAME.sha256" >/dev/null)
            cmp -s "$APK_NAME" "$RELEASE_DIR/$APK_NAME" || { echo "Existing release asset does not match this build; refusing replacement." >&2; return 1; }
          }
          if gh release view "$TAG_NAME" --json tagName >/dev/null 2>&1; then
            verify_existing_release
          else
            gh release create "$TAG_NAME" "$APK_NAME" "$APK_NAME.sha256" --title "$TAG_NAME" --generate-notes
            verify_existing_release
          fi

      - name: Remove decoded release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/android-tv-audio-reactive-release.keystore"
